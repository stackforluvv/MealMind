<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMind</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>MealMind</h1>
    </header>
    <main>
         <div class="container">
            <form class="container-form" id="recipeForm">
                <label for="ingredients">Введите ингредиенты (через запятую):</label>
                <div class="input-container">
                    <input type="text" id="ingredients" name="ingredients" placeholder="Например: курица, рис, овощи">
                    <button id="generateButton">Сгенерировать рецепт</button>
                </div>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
